<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Parking Face Recognition</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #1f2937;
            background: #f3f5f8;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        main {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 36px 0;
        }
        h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 3vw, 2rem); }
        .intro { margin: 0 0 24px; color: #5b6472; }
        .layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(260px, 0.8fr); gap: 24px; align-items: start; }
        .panel {
            overflow: hidden;
            background: #fff;
            border: 1px solid #e2e7ee;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgb(15 23 42 / 6%);
        }
        .camera { display: block; width: 100%; min-height: 300px; background: #111827; object-fit: contain; }
        .details { padding: 24px; }
        .details h2 { margin: 0 0 20px; font-size: 1.2rem; }
        .status { margin: 0 0 18px; color: #536174; font-size: 0.92rem; }
        dl { display: grid; grid-template-columns: 72px 1fr; gap: 14px 10px; margin: 0; }
        dt { font-weight: 650; }
        dd { margin: 0; overflow-wrap: anywhere; }
        @media (max-width: 760px) {
            main { padding: 24px 0; }
            .layout { grid-template-columns: 1fr; }
            .camera { min-height: 220px; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Smart Parking Face Recognition</h1>
        <p class="intro">Live driver identification for the graduation project parking workflow.</p>
        <section class="layout" aria-label="Face recognition camera and result">
            <div class="panel">
                <img class="camera" src="{{ url_for('video_feed') }}" alt="Live camera stream">
            </div>
            <section class="panel details" aria-labelledby="result-title">
                <h2 id="result-title">Recognition result</h2>
                <p id="recognition-status" class="status" role="status">Connecting to camera...</p>
                <dl>
                    <dt>Name</dt>
                    <dd id="person-name">—</dd>
                    <dt>Email</dt>
                    <dd id="person-email">—</dd>
                </dl>
            </section>
        </section>
    </main>
    <script>
        const statusText = {
            starting: "Starting camera...",
            no_face: "No face detected",
            recognized: "Registered face matched",
            unknown: "Face not registered",
            not_configured: "No local face encodings. Add enrollment images and run EncodeGenerator.py.",
            camera_unavailable: "Camera unavailable. Check that it is connected and not in use by another app.",
            camera_error: "The camera stopped returning frames.",
            database_error: "Face matched, but Firebase could not be reached.",
            recognition_error: "Could not process this frame.",
            stopped: "Camera stopped"
        };

        async function refreshResult() {
            try {
                const response = await fetch("/person_data", { cache: "no-store" });
                const result = await response.json();
                document.getElementById("person-name").textContent = result.name || "—";
                document.getElementById("person-email").textContent = result.email || "—";
                document.getElementById("recognition-status").textContent =
                    statusText[result.status] || result.status || "Waiting for recognition...";
            } catch (error) {
                document.getElementById("recognition-status").textContent =
                    "The local recognition server is unavailable.";
            } finally {
                window.setTimeout(refreshResult, 1000);
            }
        }

        refreshResult();
    </script>
</body>
</html>
